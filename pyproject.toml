[project]
name = "querywise"
version = "0.1.0"
description = "Text-to-SQL LangGraph agent with defense-in-depth and read-only MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.23",
    "mcp>=1.6.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlglot>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querywise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
