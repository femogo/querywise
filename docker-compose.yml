services:
  postgres:
    image: postgres:16-alpine
    container_name: querywise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-querywise}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_admin}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-querywise_ro}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-change_me_ro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-querywise}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: