<text x="18" y="147" fill="#e6edf3">### RELEVANT CANONICAL METRICS</text>
<text x="18" y="166" fill="#e6edf3">Use these exact formulas and filters if the question involves these concepts:</text>
<text x="18" y="204" fill="#e6edf3">- **Gross Profit &amp; Margin (Margen Bruto)** (`gross_margin`): Net sales revenue minus product unit</text>
<text x="18" y="223" fill="#e6edf3">  cost across sold items in valid orders.</text>
<text x="18" y="242" fill="#e6edf3">  - Canonical SQL: `SUM(order_items.quantity * (order_items.unit_price_applied * (1 -</text>
<text x="18" y="261" fill="#e6edf3">    order_items.discount_pct / 100.0) - products.unit_cost))`</text>
<text x="18" y="280" fill="#e6edf3">  - Required tables: `orders, order_items, products` | Mandatory filters: `orders.status NOT IN</text>
<text x="18" y="299" fill="#e6edf3">    ('cancelled', 'refunded')`</text>
<text x="18" y="318" fill="#e6edf3">  - Default assumption: Net of item discounts minus products.unit_cost on valid orders.</text>
<text x="18" y="356" fill="#e6edf3">### VERIFIED SQL EXAMPLES (FEW-SHOT REFERENCE)</text>
<text x="18" y="375" fill="#e6edf3">Adapt these audited PostgreSQL patterns (joins, filters, safe columns) when applicable:</text>
