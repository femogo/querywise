<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 334" width="821" role="img" aria-label="curl -s localhost:8000/query">
<rect width="821" height="334" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 34h821" stroke="#30363d"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="410.5" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">curl -s localhost:8000/query</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" xml:space="preserve">
<text x="18" y="52" fill="#7ee787" font-weight="600">$ curl -s localhost:8000/query -H 'Content-Type: application/json' -d '{"question": "Dame el NIF de</text>
<text x="18" y="71" fill="#7ee787" font-weight="600">  los 5 clientes que más han comprado"}' | jq '{status, retry_count, sql_history, final_answer}'</text>
<text x="18" y="90" fill="#e6edf3">{</text>
<text x="18" y="109" fill="#e6edf3">  "status": "failed",</text>
<text x="18" y="128" fill="#e6edf3">  "retry_count": 1,</text>
<text x="18" y="147" fill="#e6edf3">  "sql_history": [</text>
<text x="18" y="166" fill="#e6edf3">    "SELECT cu.tax_id FROM customers cu JOIN orders o ON o.customer_id = cu.customer_id WHERE</text>
<text x="18" y="185" fill="#e6edf3">      o.status NOT IN ('cancelled', 'refunded') GROUP BY cu.tax_id ORDER BY SUM(o.subtotal_amount)</text>
<text x="18" y="204" fill="#e6edf3">      DESC LIMIT 5"</text>
<text x="18" y="223" fill="#e6edf3">  ],</text>
<text x="18" y="242" fill="#e6edf3">  "final_answer": "No pude ejecutar una consulta SQL válida y segura para responder a tu pregunta</text>
<text x="18" y="261" fill="#e6edf3">    tras 1 intentos. Último motivo: Error executing tool run_query: Access to sensitive PII column</text>
<text x="18" y="280" fill="#e6edf3">    'tax_id' is forbidden."</text>
<text x="18" y="299" fill="#e6edf3">}</text>
</g></svg>
